[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlu-service"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]~=0.136.0",
    "geopy~=2.4.1",
    "mistralai~=2.4.5",
    "numpy~=2.4.3",
    "pydantic~=2.13.1",
    "pydantic-settings~=2.15.0",
    "scikit-learn~=1.7.2",
    "sentence-transformers~=5.1.1",
]

[project.optional-dependencies]
dev = [
    "mypy~=1.18.2",
    "pytest~=9.0.2",
    "ruff~=0.13.2",
    "scikit-learn-stubs~=0.0.3",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/nlu/prompts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geopy", "geopy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
