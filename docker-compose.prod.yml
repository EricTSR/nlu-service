services:
  nlu-service:
    image: nlu-service:latest
    restart: always
    ports:
      - "8000:8000"
    environment:
      WEB_CONCURRENCY: 4
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

